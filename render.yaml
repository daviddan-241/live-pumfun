services:
  - type: web
    name: arcc-telegram
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION
        sync: false
      - key: SOURCE_CHANNELS
        value: '["Alpha_Circle1","Maestrosdegen","BRUCECALL0"]'
      - key: PUBLIC_CHANNEL_USERNAME
        value: Aires_Insider
      - key: PRIVATE_GROUP_LINK
        value: https://t.me/+NxFFO4JXdF8zMWU0
      - key: ARCC_CONTACT
        value: '@William_ARCC'
      - key: CONFIDENCE_THRESHOLD
        value: '0.6'
      - key: DASHBOARD_PORT
        value: '3000'
      - key: ENABLE_DASHBOARD
        value: 'true'
      - key: LOG_LEVEL
        value: info
      - key: DB_PATH
        value: /data/arcc.db
      - key: WORKER_CONCURRENCY
        value: '4'
      - key: HEARTBEAT_INTERVAL
        value: '30000'
    disk:
      name: arcc-data
      mountPath: /data
      sizeGB: 1
